name: Update radio play counts

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install Google authentication library
        run: npm install google-auth-library


      - name: Pull counts from GA4
        run: node scripts/update-play-counts.mjs
        env:
          GA4_PROPERTY_ID:
            ${{ secrets.GA4_PROPERTY_ID }}

          GA4_SERVICE_ACCOUNT_JSON:
            ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}


      - name: Commit updated counts
        run: |

          if git diff --quiet -- audio/play-counts.json; then
            echo "No count changes."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            audio/play-counts.json

          git commit \
            -m "Update radio play counts"

          git push