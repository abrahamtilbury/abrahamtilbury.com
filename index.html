<!DOCTYPE html>
<html lang="en">
<head>
    
    <!-- Page Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraham Tilbury</title>

    <!-- SEO Metadata -->
    <meta
        property="og:title"
        content="Abraham Tilbury">
    <meta
        property="og:description"
        content="Music, songwriting, production and collaborations by Abraham Tilbury.">
    <meta
        property="og:image"
        content="https://abrahamtilbury.com/images/homepage.webp">
    <meta
        property="og:url"
        content="https://abrahamtilbury.com/">
    <meta
        property="og:type"
        content="website">
    <meta
        property="og:site_name"
        content="Abraham Tilbury">
    <meta
        name="twitter:card"
        content="summary_large_image">
    <meta
        name="twitter:title"
        content="Abraham Tilbury">
    <meta
        name="twitter:description"
        content="Music, songwriting, production and collaborations by Abraham Tilbury.">
    <meta
        name="twitter:image"
        content="https://abrahamtilbury.com/images/homepage.webp">
    <meta
        name="description"
        content="Official website of Abraham Tilbury, Australian electronic musician, songwriter and electronics technician.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commit+Mono&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <script src="audio/radio.js" defer></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="180x180" href="images/favicon-180x180.png">
    <link rel="shortcut icon" href="images/favicon.ico">

    <link rel="canonical" href="https://abrahamtilbury.com/">
</head>
<body>
    
    <!-- Header / Navigation -->
    <header>
        <div>
            <div class="header-left">
                <h1 class="site-title">
                    <a href="index.html">Abraham Tilbury</a>
                </h1>
                <div
                    class="site-radio"
                    role="group"
                    aria-label="Abraham Tilbury Radio">
                    <button
                        class="radio-play"
                        data-radio-play
                        type="button"
                        aria-label="Play Abraham Tilbury Radio">
                        ▶︎
                    </button>
                    <label class="radio-volume">
                        <span class="visually-hidden">
                            Radio volume
                        </span>
                        <input
                            data-radio-volume
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0.72"
                            aria-label="Radio volume">
                    </label>
                    <span
                        class="visually-hidden"
                        data-radio-status
                        aria-live="polite">
                        Radio paused
                    </span>
                </div>
            </div>
            <nav aria-label="Main navigation">
                <a href="music.html">Music</a>
                <a href="collaborations.html">Collaborations</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
        <!-- Hero Image -->
        <img 
            class="hero-image"
            src="images/homepage.webp"
            alt="Portrait of Abraham Tilbury wearing a red shirt."
            loading="eager"
            width="1800"
            height="1200"
            decoding="async">
        
    </header>

    <!-- Footer / Social Links -->
    <footer>
        <div class="social-links">
            <a href="https://open.spotify.com/artist/4aQXVB8RpVJTrpQoKdkE4M?si=oL8vYNXbQD2JA0Hxe9U86w"
                target="_blank"
                rel="noopener">
                    Spotify
            </a>
            
            <a href="https://www.instagram.com/abrahamtilbury/"
                target="_blank"
                rel="noopener">
                    Instagram
            </a>
            
            <a href="https://youtube.com/@AbrahamTilbury"
                target="_blank"
                rel="noopener">
                    YouTube
            </a>
            
            <a href="https://soundcloud.com/abrahamtilbury"
                target="_blank"
                rel="noopener">
                    SoundCloud
            </a>
            
            <a href="https://abrahamtilbury.bandcamp.com/"
                target="_blank"
                rel="noopener">
                    Bandcamp
            </a>
            
        </div>

        <p>© 2026 Abraham Tilbury</p>
        
    </footer>
</body>
</html>
